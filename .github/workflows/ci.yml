name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, CGL and PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - uses: ramsey/composer-install@v4

      - name: Audit dependencies
        run: composer audit

      - name: Lint PHP
        run: composer lint:php

      - name: Coding standards
        run: composer cgl:check

      - name: PHPStan
        run: composer phpstan -- --no-progress

  unit:
    name: Unit tests PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Unit tests
        run: composer test:unit

  javascript:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The shipped JavaScript has no build step and the unit tests use the
      # Node test runner, so there is nothing to install. The Playwright
      # end-to-end suite in Tests/E2E needs a running TYPO3 and stays out of CI.
      - name: JavaScript unit tests
        run: node --test 'Tests/JavaScript/*.test.js'

  functional:
    name: Functional tests PHP ${{ matrix.php }}, MariaDB 10.11
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=768M

      - uses: ramsey/composer-install@v4

      - name: Functional tests
        env:
          typo3DatabaseDriver: mysqli
          typo3DatabaseHost: 127.0.0.1
          typo3DatabasePort: 3306
          typo3DatabaseUsername: root
          typo3DatabasePassword: root
          typo3DatabaseName: typo3_ci
        run: composer test:functional
